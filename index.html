<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0" />
  <title>EL PODEROSO 2 ✌️</title>
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root {
      --primary: #2d3436;
      --accent: #636e72;
      --light: #f1f2f6;
      --card: #ffffff;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(0,0,0,.08);
      --footer-text: #8c959f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      color: #2d3436;
      display: flex;
      flex-direction: column;
      padding-bottom: 220px; 
      overscroll-behavior-y: none
    }

    /* HEADER */
    .header {
      background: var(--primary);
      padding: 18px 20px;
      text-align: center;
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 { color: #fff; font-size: 1.5rem; font-weight: 800; }

    .container { max-width: 540px; margin: 0 auto; padding: 20px 16px; flex: 1; }

    /* FECHA ACTUAL */
    .date-badge {
      background: var(--primary);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }
    .date-badge strong { display: block; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; margin-top: 4px; }

    /* SELECTOR DE SOCIO */
    .selector-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid #eee;
    }
    .btn-select {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-select::after { content: '▼'; font-size: 0.8rem; }

    /* LISTADO DE SOCIOS */
    .members-list {
      display: none;
      background: #fff;
      border: 1px solid #dfe6e9;
      border-radius: 10px;
      margin-top: 10px;
      max-height: 350px;
      overflow-y: auto;
      overscroll-behavior: contain; 
      -webkit-overflow-scrolling: touch;
    }
    .member-item {
      padding: 18px 15px;
      border-bottom: 1px solid #eee;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      touch-action: manipulation;
    }
    .member-item:active { background: #f1f2f6; }
    .member-item small { color: var(--accent); }

    /* TARJETA DE RESULTADO */
    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: none;
      border: 1px solid #eee;
    }
    .result-header {
      background: #f8f9fa;
      padding: 25px 18px;
      text-align: center;
      border-bottom: 2px solid #eee;
    }
    .member-name { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; color: var(--primary); }
    .member-plate { display: inline-block; background: var(--accent); color: #fff; padding: 4px 12px; border-radius: 6px; margin-top: 8px; font-weight: 700; }

    /* RUTA ASIGNADA */
    .route-display { padding: 22px 18px; text-align: center; }
    .route-badge {
      display: flex; align-items: center; justify-content: center;
      padding: 25px; border-radius: 12px;
      font-weight: 900; font-size: 1.8rem; margin: 15px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* BOTONES DE SECCIÓN TRABAJO */
    .cal-toggle-btn, .sign-toggle-btn {
      width: 100%; border: none;
      padding: 14px; font-weight: 800; border-radius: 10px; cursor: pointer;
      margin-bottom: 10px; font-size: 0.95rem;
    }
    .cal-toggle-btn { background: #dfe6e9; color: #2d3436; }
    .sign-toggle-btn { background: #fdcb6e; color: #2d3436; }
    
    .calendar-section, .signs-section { display: none; padding: 18px 5px; }
    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
    .cal-nav button { background: var(--primary); color: #fff; border: none; width: 35px; height: 35px; border-radius: 8px; font-weight: bold; }
    
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day-header { font-size: .7rem; font-weight: 800; color: #000; text-align: center; padding-bottom: 5px; }
    .cal-day { 
      min-height: 58px; background: #fff; border: 1px solid #f0f0f0; 
      border-radius: 4px; padding: 2px; display: flex; flex-direction: column; align-items: center;
    }
    .day-num { font-size: .75rem; font-weight: 800; }
    .day-route { font-size: 0.5rem; font-weight: 900; text-align: center; line-height: 1; word-break: break-all; }
    .cal-day.today-highlight { outline: 3px solid #000; outline-offset: -2px; z-index: 5; }

    /* REJILLA DE LETREROS EN 3 COLUMNAS */
    .signs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .sign-btn {
      background: #ffffff;
      border: 2px solid #dfe6e9;
      border-radius: 8px;
      padding: 10px 4px;
      font-size: 0.65rem;
      font-weight: 800;
      cursor: pointer;
      color: #2d3436;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      word-break: break-word;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
    }
    .sign-btn:active {
      background: #f1f2f6;
      transform: scale(0.95);
    }

    /* CAPA MODAL FLOTANTE PARA VER LA IMAGEN GRANDE */
    .image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }
    .image-modal img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      object-fit: contain;
    }
    .modal-close-btn {
      margin-top: 20px;
      background: #ff7675;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* FOOTER ESTILO GITHUB */
    .footer {
      background: #ffffff;
      border-top: 1px solid #eee;
      padding: 12px 20px;
      margin-top: auto;
      text-align: center;
    }
    .footer-content {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      list-style: none;
    }
    .footer-links li a {
      color: #0969da;
      text-decoration: none;
      font-size: 0.8rem;
    }
    .footer-copy {
      color: var(--footer-text);
      font-size: 0.7rem;
      line-height: 1.5;
    }

    /* BOTÓN ACTUALIZAR AJUSTADO */
    #btnActualizar {
      position: fixed;
      bottom: 30px; 
      right: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 22px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #btnActualizar:active {
      transform: scale(0.9);
    }
  </style>
  <meta name="theme-color" content="#2d3436">
</head>
<body>

<div class="header">
  <h1>🚐 EL PODEROSO 2 ✌️</h1>
</div>

<div class="container">
  <div class="date-badge">
    📅 FECHA DE HOY: <strong id="todayStr">–</strong>
  </div>

  <div class="selector-card">
    <button class="btn-select" onclick="toggleMemberList()">
      SELECCIONAR NOMBRE SOCIO
    </button>
    <div class="members-list" id="memberList"></div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="member-name" id="rName">–</div>
      <div class="member-plate" id="rPlate">–</div>
    </div>
    
    <div class="route-display">
      <p style="font-weight:800; color:var(--accent); font-size:.85rem;">📍 RUTA ASIGNADA PARA HOY: 📍</p>
      <div id="rTodayRoute"></div>

      <button class="cal-toggle-btn" onclick="toggleCalendar()">📅 VER TODO EL MES</button>

      <div class="calendar-section" id="calendarSection">
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <div id="calMonthLabel" style="font-weight:900; text-transform:uppercase;">–</div>
          <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <button class="sign-toggle-btn" onclick="toggleSignsSection()">🪧 VER LETREROS DE RUTAS</button>

      <div class="signs-section" id="signsSection">
        <div class="signs-grid" id="signsGrid"></div>
      </div>

    </div>
  </div>
</div>

<div class="image-modal" id="imageModal">
  <img id="modalImg" src="" alt="Letrero Ampliado">
  <button class="modal-close-btn" onclick="closeModal()">❌ CERRAR LETRERO</button>
</div>

<footer class="footer">
  <div class="footer-content" style="gap: 8px;">
    <ul class="footer-links" style="margin: 5px 0;">
      <li><a href="#" style="color: #0969da; font-size: 0.75rem;">Soporte Técnico</a></li>
      <li><a href="#" style="color: #0969da; font-size: 0.75rem;">Privacidad</a></li>
      <li><a href="#" style="color: #0969da; font-size: 0.75rem;">Seguridad </a></li>
    </ul>
    <div class="footer-copy" style="line-height: 1.6;">
      © <span id="year"></span> <strong>VillcaSoft Systems Ltd.</strong><br> 
      Director de Proyecto: <strong>Villca Condori Ruben</strong><br>
      <small style="color: #57606a; font-size: 0.65rem;">Versión 2.4.0 (Enterprise Edition)</small>
    </div>
  </div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const DATA_URL = 'data.json';
let members = [];
let currentMember = null;
let calDate = new Date();
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// MAPEO EXACTO: 'texto' es lo que ve el usuario, 'archivo' es tu imagen real .jpg en la carpeta
const MAPA_LETREROS = [
  { texto: "6 DE AGOSTO", archivo: "6_de_agosto" },
  { texto: "232", archivo: "232" },
  { texto: "ABRA SACABA", archivo: "abra_sacaba" },
  { texto: "ALTO OBRAJES 212", archivo: "alto_obrajes212" },
  { texto: "ALTO OBRAJES 244", archivo: "alto_obrajes244" },
  { texto: "ALTO PARAISO", archivo: "alto_paraiso" },
  { texto: "AMANCAYAS", archivo: "amancayas" },
  { texto: "AURORA", archivo: "aurora" },
  { texto: "BELLA VISTA", archivo: "bella_vista" },
  { texto: "CANALPATA", archivo: "canalpata" },
  { texto: "CHURITIA", archivo: "churitia" },
  { texto: "CIRCUNVALACION", archivo: "circunvalacion" },
  { texto: "CIRCUNVALACION 220", archivo: "circunvalacion220" },
  { texto: "COLOMBIA 212", archivo: "colombia212" },
  { texto: "COLOMBIA 244", archivo: "colombia244" },
  { texto: "CORRALONES", archivo: "corralones" },
  { texto: "ESMERALDA", archivo: "esmeralda" },
  { texto: "FABRIL HUAYLLANI", archivo: "fabril_huallani" },
  { texto: "ISPIRU", archivo: "ispiru" },
  { texto: "KORIHUMA 2", archivo: "korihuma2" },
  { texto: "L.L. 212", archivo: "L.L.212" },
  { texto: "L.L. ALTA", archivo: "L.L.alta" },
  { texto: "L.L. BAJA", archivo: "L.L.baja" },
  { texto: "MADERERO", archivo: "maderero" },
  { texto: "PUEBLITO", archivo: "pueblito" },
  { texto: "TACOPOCA", archivo: "tacopoca" },
  { texto: "TUNEL 212", archivo: "tunel212" },
  { texto: "TUNEL 220", archivo: "tunel220" },
  { texto: "TUNEL 244", archivo: "tunel244" },
  { texto: "TUSCA ALTO", archivo: "tusca_alto" },
  { texto: "V. ANIMAS", archivo: "v.animas" },
  { texto: "V.O. 212", archivo: "v.o.212" },
  { texto: "V.O. 220", archivo: "v.o.220" },
  { texto: "V.O. 244", archivo: "v.o.244" },
  { texto: "VALLE PARAISO", archivo: "valle_paraiso" }
];

async function loadData() {
  try {
    const resp = await fetch(DATA_URL);
    members = await resp.json();
    members.sort((a, b) => a.name.localeCompare(b.name));
    renderMemberList();
    generateSignsButtons(); 
  } catch(e) { console.error("Error al cargar JSON"); }
}

function initToday() {
  const now = new Date();
  const days = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  document.getElementById('todayStr').textContent = `${days[now.getDay()]} ${now.getDate()} DE ${MONTHS[now.getMonth()].toUpperCase()}`;
}

function toggleMemberList() {
  const list = document.getElementById('memberList');
  list.style.display = (list.style.display === 'block') ? 'none' : 'block';
}

function renderMemberList() {
  const list = document.getElementById('memberList');
  list.innerHTML = '';
  members.forEach(m => {
    const item = document.createElement('div');
    item.className = 'member-item';
    item.innerHTML = `<span>${m.name}</span> <small>${m.plate}</small>`;
    item.onclick = () => {
      showMember(m);
      toggleMemberList();
    };
    list.appendChild(item);
  });
}

function showMember(member) {
  currentMember = member;
  document.getElementById('rName').textContent = member.name;
  document.getElementById('rPlate').textContent = member.plate;
  
  const now = new Date();
  const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const todayData = member.schedule[todayKey];
  const routeEl = document.getElementById('rTodayRoute');

  if (todayData) {
    const bg = todayData.color || '#636e72';
    routeEl.innerHTML = `<div class="route-badge" style="background:${bg}; color:${getContrastYIQ(bg)}">${todayData.route}</div>`;
  } else {
    routeEl.innerHTML = `<div style="padding:20px; background:#eee; border-radius:10px; font-weight:bold;">SIN RUTA PROGRAMADA</div>`;
  }
  
  document.getElementById('resultCard').style.display = 'block';
  renderCalendar();
}

function renderCalendar() {
  if (!currentMember) return;
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  const today = new Date();
  
  document.getElementById('calMonthLabel').textContent = `${MONTHS[month]} ${year}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  ['D','L','M','M','J','V','S'].forEach(d => {
    const h = document.createElement('div'); h.className='cal-day-header'; h.textContent=d; grid.appendChild(h);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    grid.appendChild(Object.assign(document.createElement('div'), {className: 'cal-day empty', style: 'background:#f8f9fa; border:none'}));
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sched = currentMember.schedule[dateKey];
    const dayEl = document.createElement('div');
    dayEl.className = 'cal-day';
    
    if(d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
      dayEl.classList.add('today-highlight');
    }

    if(sched) {
      const bgColor = sched.color || '#636e72';
      dayEl.style.background = bgColor;
      dayEl.style.color = getContrastYIQ(bgColor);
      dayEl.innerHTML = `<div class="day-num">${d}</div><div class="day-route">${sched.route}</div>`;
    } else {
      dayEl.innerHTML = `<div class="day-num">${d}</div>`;
    }
    grid.appendChild(dayEl);
  }
}

function changeMonth(dir) {
  calDate.setMonth(calDate.getMonth() + dir);
  renderCalendar();
}

function toggleCalendar() {
  const sec = document.getElementById('calendarSection');
  sec.style.display = (sec.style.display === 'block') ? 'none' : 'block';
}

function toggleSignsSection() {
  const sec = document.getElementById('signsSection');
  sec.style.display = (sec.style.display === 'block') ? 'none' : 'block';
}

function generateSignsButtons() {
  const grid = document.getElementById('signsGrid');
  grid.innerHTML = '';
  
  MAPA_LETREROS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'sign-btn';
    btn.textContent = item.texto;
    btn.onclick = () => openSignImage(item.archivo);
    grid.appendChild(btn);
  });
}

function openSignImage(fileName) {
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');
  
  // Apunta de manera exacta a tu carpeta letreros/nombre_archivo.jpg
  modalImg.src = `letreros/${fileName}.jpg`;
  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('imageModal').style.display = 'none';
}

function getContrastYIQ(hex){
  hex = hex.replace("#", "");
  const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  return ((r*299)+(g*587)+(b*114))/1000 >= 128 ? 'black' : 'white';
}

function actualizarApp() {
    const btn = document.getElementById('btnActualizar');
    const texto = document.getElementById('textoBtn');
    btn.style.backgroundColor = "#28a745";
    btn.style.boxShadow = "0px 4px 10px rgba(0,0,0,0.2)";
    texto.innerText = "Actualizando...";
    setTimeout(function() {
        const nuevaURL = window.location.href.split('?')[0] + '?v=' + new Date().getTime();
        window.location.href = nuevaURL;
    }, 600); 
}

document.addEventListener('DOMContentLoaded', () => { initToday(); loadData(); });
</script>

<button id="btnActualizar" onclick="actualizarApp()">
    <span>🔄</span> <span id="textoBtn">Actualizar Rutas</span>
</button>

</body>
</html>
